<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#8b5e34"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <title>Dashboard - Menuiserie</title>

</head>

<body>

<header class="header">

    <div class="logo">
        🪚 Gestion Menuiserie
    </div>

    <a
        href="index.html"
        class="header-link"
    >
        Accueil
    </a>

</header>


<main class="container">

    <div class="page-header">

        <div>

            <h1>
                Dashboard
            </h1>

            <p>
                Gestion de vos commandes
            </p>

        </div>


        <a
            href="ajouter-commande.html"
            class="btn btn-primary"
        >
            + Nouvelle commande
        </a>

    </div>


    <div class="stats">


        <div class="stat-card">

            <div class="stat-icon">
                📋
            </div>

            <div>

                <strong id="totalCommandes">
                    0
                </strong>

                <span>
                    Commandes
                </span>

            </div>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                💰
            </div>

            <div>

                <strong id="totalPrix">
                    0 DH
                </strong>

                <span>
                    Total
                </span>

            </div>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                💵
            </div>

            <div>

                <strong id="totalReste">
                    0 DH
                </strong>

                <span>
                    Reste à recevoir
                </span>

            </div>

        </div>


    </div>


    <section>

        <div class="section-title">

            <h2>
                Commandes
            </h2>

        </div>


        <div id="listeCommandes">

        </div>


        <div
            id="chargement"
            class="loading"
        >
            Chargement...
        </div>


        <div
            id="aucuneCommande"
            class="empty-state"
            style="display:none"
        >

            <div>
                📋
            </div>

            <h2>
                Aucune commande
            </h2>

            <p>
                Commencez par ajouter votre première commande.
            </p>

            <a
                href="ajouter-commande.html"
                class="btn btn-primary"
            >
                Ajouter une commande
            </a>

        </div>

    </section>

</main>


<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="js/config.js"></script>

<script src="js/dashboard.js"></script>

</body>

</html>
