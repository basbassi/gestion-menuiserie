<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#8b5e34"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <title>تعديل الطلب</title>

</head>


<body>

<header class="header">

    <div class="logo">
        🪚 إدارة النجارة
    </div>

    <a
        href="dashboard.html"
        class="header-link"
    >
        ← رجوع
    </a>

</header>


<main class="form-container">

    <div class="form-card">

        <h1>
            تعديل الطلب
        </h1>

        <p class="form-description">
            قم بتعديل المعلومات.
        </p>


        <form id="formModifier">


            <div class="form-group">

                <label>
                    العميل *
                </label>

                <input
                    type="text"
                    id="client"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    المشروع *
                </label>

                <input
                    type="text"
                    id="projet"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    الوصف *
                </label>

                <textarea
                    id="description"
                    rows="4"
                    required
                ></textarea>

            </div>


            <div class="form-row">


                <div class="form-group">

                    <label>
                        السعر (درهم) *
                    </label>

                    <input
                        type="number"
                        id="prix"
                        min="0"
                        step="0.01"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        التسبيق (درهم) *
                    </label>

                    <input
                        type="number"
                        id="avance"
                        min="0"
                        step="0.01"
                        required
                    >

                </div>

            </div>


            <div class="reste-preview">

                المتبقي :

                <strong id="reste">
                    0 درهم
                </strong>

            </div>


            <div class="form-group">

                <label>
                    تاريخ التسليم *
                </label>

                <input
                    type="date"
                    id="livraison"
                    required
                >

            </div>


            <div class="form-actions">

                <a
                    href="dashboard.html"
                    class="btn btn-light"
                >
                    إلغاء
                </a>


                <button
                    type="submit"
                    class="btn btn-primary"
                    id="btnModifier"
                >
                    💾 حفظ
                </button>

            </div>


            <div
                id="message"
                class="message"
            ></div>

        </form>

    </div>

</main>


<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="js/config.js"></script>

<script src="js/modifier-commande.js"></script>

</body>

</html>
