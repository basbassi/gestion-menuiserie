<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#8b5e34"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <title>Modifier commande</title>

</head>


<body>

<header class="header">

    <div class="logo">
        🪚 Gestion Menuiserie
    </div>

    <a
        href="dashboard.html"
        class="header-link"
    >
        ← Retour
    </a>

</header>


<main class="form-container">

    <div class="form-card">

        <h1>
            Modifier la commande
        </h1>

        <p class="form-description">
            Modifiez les informations.
        </p>


        <form id="formModifier">


            <div class="form-group">

                <label>
                    Client *
                </label>

                <input
                    type="text"
                    id="client"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Projet *
                </label>

                <input
                    type="text"
                    id="projet"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Description *
                </label>

                <textarea
                    id="description"
                    rows="4"
                    required
                ></textarea>

            </div>


            <div class="form-row">


                <div class="form-group">

                    <label>
                        Prix (DH) *
                    </label>

                    <input
                        type="number"
                        id="prix"
                        min="0"
                        step="0.01"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Avance (DH) *
                    </label>

                    <input
                        type="number"
                        id="avance"
                        min="0"
                        step="0.01"
                        required
                    >

                </div>

            </div>


            <div class="reste-preview">

                Reste :

                <strong id="reste">
                    0 DH
                </strong>

            </div>


            <div class="form-group">

                <label>
                    Date de livraison *
                </label>

                <input
                    type="date"
                    id="livraison"
                    required
                >

            </div>


            <div class="form-actions">

                <a
                    href="dashboard.html"
                    class="btn btn-light"
                >
                    Annuler
                </a>


                <button
                    type="submit"
                    class="btn btn-primary"
                    id="btnModifier"
                >
                    💾 Enregistrer
                </button>

            </div>


            <div
                id="message"
                class="message"
            ></div>

        </form>

    </div>

</main>


<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="js/config.js"></script>

<script src="js/modifier-commande.js"></script>

</body>

</html>
